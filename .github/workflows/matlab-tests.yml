name: MATLAB Tests

on:
  push:
    branches: [master]
    paths:
      - 'core/**'
      - 'communication/**'
      - 'stimuli/**'
      - 'tests/**'
      - 'setupCI.m'
      - '.github/workflows/matlab-tests.yml'
  pull_request:
    branches: [master]
    paths:
      - 'core/**'
      - 'communication/**'
      - 'stimuli/**'
      - 'tests/**'
      - 'setupCI.m'
      - '.github/workflows/matlab-tests.yml'
  workflow_dispatch: {}

jobs:
  test:
    name: Run MATLAB Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Clone matlab-jzmq dependency (JeroMQ ØMQ wrapper)
        run: |
          git clone --depth 1 https://github.com/CogPlatform/matlab-jzmq.git \
            "${{ github.workspace }}/../matlab-jzmq"
      # Java ships bundled with MATLAB and the jeromq jar ships inside
      # matlab-jzmq, so no extra JVM install is required. addOptickaToPath
      # discovers the sibling folder above automatically.

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb
          sudo apt-get install -y xauth
          sudo apt-get install -y libglut-dev
          sudo apt-get install -y libglu1-mesa-dev
          sudo apt-get install -y libx11-dev
          sudo apt-get install -y libdc1394-dev
          sudo apt-get install -y libraw1394-dev
          sudo apt-get install -y curl
          sudo apt-get install -y patchelf

      - name: Download Psychtoolbox dependency (V3.0.21 as the last version useable with CI)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Use the authenticated release API rather than the raw
          # releases/download URL: that endpoint intermittently answers with a
          # 92-byte nginx "504 Gateway Time-out" page, which unzip then reports
          # as "End-of-central-directory signature not found" - a misleading
          # error for what is really an upstream HTTP failure.
          gh release download 3.0.21.0 --repo Psychtoolbox-3/Psychtoolbox-3 \
            --pattern 3.0.21.0.zip --dir /tmp --clobber
          unzip -o -d /tmp/PTB /tmp/3.0.21.0.zip

      # PTB 3.0.21's prebuilt mex files request an executable stack
      # (PT_GNU_STACK = RWE, 16 of the 19 shipped mex files). The ubuntu-24.04
      # image tolerated that, but ubuntu-latest migrated to ubuntu-26.04 in
      # October 2026, whose loader refuses such objects with
      #   "cannot enable executable stack as shared object requires: Invalid argument"
      # Every mex (Screen, GetSecs, WaitSecs, PsychHID, ...) then fails as
      # "Invalid MEX-file" and most of the suite errors out. Clearing the execute
      # bit on that single program header lets them load again: no code, symbols,
      # sections or relocations are touched, and none of these binaries actually
      # execute code from the stack - the flag is a toolchain artifact.
      - name: Clear executable-stack flag on PTB mex files
        run: |
          find /tmp/PTB -name '*.mexa64' -print0 | xargs -0 -r patchelf --clear-execstack
          # Fail loudly if any mex still requests an executable stack:
          if find /tmp/PTB -name '*.mexa64' -print0 | xargs -0 -r readelf -lW 2>/dev/null | grep -q 'GNU_STACK.*RWE'; then
            echo "::error::some PTB mex files still request an executable stack"
            exit 1
          fi
          echo "All PTB mex files now request a non-executable stack."

      # Stock PTB Screen segfaults on Mesa's software rasterizer (llvmpipe,
      # which is what Xvfb provides): PsychOSSetVBLSyncLevel() queries
      # GLX_SWAP_INTERVAL_EXT with glXQueryDrawable(), and llvmpipe leaves that
      # GLX dispatch slot NULL, so the call jumps to address 0. See ci/ptb/README.md
      # for provenance and rebuild instructions.
      - name: Install patched Screen.mexa64 (Xvfb/llvmpipe GLX fix)
        run: |
          cp ci/ptb/Screen.mexa64 /tmp/PTB/Psychtoolbox/PsychBasic/Screen.mexa64
          (cd ci/ptb && sha256sum -c Screen.mexa64.sha256)

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: latest
          cache: true

      - name: Start virtual display
        run: |
          Xvfb :99 -screen 0 1024x768x24 > /tmp/xvfb.log 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      # Hardware-tagged tests are excluded explicitly: they self-skip under
      # GitHub Actions anyway, and a single unguarded window test takes the
      # whole job down because Screen.mexa64 segfaults inside Mesa's libGLX
      # on Xvfb (see help/PTB-Github-workflow.md).
      - name: Run tests under virtual display
        uses: matlab-actions/run-command@v3
        with:
          command: setupOptickaCI; runOptickaTests('excludeTag', 'hardware');

  # Separate job so a window-opening failure cannot take down the unit suite, and
  # so the hardware tests can run against the patched Screen.mexa64.
  screen-hardware:
    name: Screen hardware tests (Xvfb, patched Screen)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb
          sudo apt-get install -y xauth
          sudo apt-get install -y libglut-dev
          sudo apt-get install -y libglu1-mesa-dev
          sudo apt-get install -y libx11-dev
          sudo apt-get install -y libdc1394-dev
          sudo apt-get install -y libraw1394-dev
          sudo apt-get install -y curl
          sudo apt-get install -y patchelf

      - name: Download Psychtoolbox dependency (V3.0.21 as the last version useable with CI)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Use the authenticated release API rather than the raw
          # releases/download URL: that endpoint intermittently answers with a
          # 92-byte nginx "504 Gateway Time-out" page, which unzip then reports
          # as "End-of-central-directory signature not found" - a misleading
          # error for what is really an upstream HTTP failure.
          gh release download 3.0.21.0 --repo Psychtoolbox-3/Psychtoolbox-3 \
            --pattern 3.0.21.0.zip --dir /tmp --clobber
          unzip -o -d /tmp/PTB /tmp/3.0.21.0.zip

      # Same loader fix as the unit-test job: PTB 3.0.21's mex files request an
      # executable stack, which the ubuntu-26.04 image refuses to load.
      - name: Clear executable-stack flag on PTB mex files
        run: |
          find /tmp/PTB -name '*.mexa64' -print0 | xargs -0 -r patchelf --clear-execstack
          if find /tmp/PTB -name '*.mexa64' -print0 | xargs -0 -r readelf -lW 2>/dev/null | grep -q 'GNU_STACK.*RWE'; then
            echo "::error::some PTB mex files still request an executable stack"
            exit 1
          fi

      - name: Install patched Screen.mexa64 (Xvfb/llvmpipe GLX fix)
        run: |
          cp ci/ptb/Screen.mexa64 /tmp/PTB/Psychtoolbox/PsychBasic/Screen.mexa64
          (cd ci/ptb && sha256sum -c Screen.mexa64.sha256)

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: latest
          cache: true

      - name: Start virtual display
        run: |
          Xvfb :99 -screen 0 1024x768x24 > /tmp/xvfb.log 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      # The hardware tests self-skip when GITHUB_ACTIONS is set
      # (assumeFalse(..., ~isempty(getenv('GITHUB_ACTIONS')))). The runner forces
      # that variable and a step-level `env: GITHUB_ACTIONS: ""` does not win, so
      # runScreenHardwareTests clears it with setenv() before running the suite.
      # MATLAB must be launched through matlab-actions/run-command: a bare
      # `matlab -batch` in a run: step cannot check out a licence on the runner.
      - name: Run ScreenManagerTest hardware suite
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('ci'); runScreenHardwareTests
